name: Android Build & Signed Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"

jobs:
  build-apk:
    name: Build Debug & Release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses & Ensure API 37
        run: |
          SDKMGR="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-37" "build-tools;36.0.0" || true
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Ephemeral Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storetype PKCS12 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias androiddebugkey \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Assemble Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTube-Studio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Assemble Signed Production Release APK (R8 Minified)
        if: github.event_name != 'pull_request'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${RUNNER_TEMP}/release-upload-key.jks"
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            echo "Using encrypted GitHub Repository Secret keystore."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            export KEYSTORE_PATH="$KEYSTORE_FILE"
            export STORE_PASSWORD="$RELEASE_STORE_PASSWORD"
            export KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
          else
            echo "::warning::RELEASE_KEYSTORE_BASE64 secret not configured yet — generating ephemeral CI signing key so the minified Release APK still builds. Configure repository secrets for consistent signing across future app updates."
            TEMP_PASS="YTubeStudioCI2026!"
            keytool -genkeypair \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias upload \
              -storepass "$TEMP_PASS" -keypass "$TEMP_PASS" \
              -dname "CN=Tamal Mitra, OU=YTube Studio, O=Tamal Mitra, C=IN"
            export KEYSTORE_PATH="$KEYSTORE_FILE"
            export STORE_PASSWORD="$TEMP_PASS"
            export KEY_PASSWORD="$TEMP_PASS"
          fi
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Package Release APK & SHA-256 Checksum
        if: github.event_name != 'pull_request'
        run: |
          VERSION_TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            VERSION_TAG="v1.0.0-${GITHUB_SHA::7}"
          fi
          mkdir -p release-artifacts
          OUT_APK="release-artifacts/YTube-Studio-${VERSION_TAG}-arm64-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT_APK"
          (cd release-artifacts && sha256sum "$(basename "$OUT_APK")" > "$(basename "$OUT_APK").sha256")
          ls -lh release-artifacts/

      - name: Upload Production Release APK Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: YTube-Studio-release-apk
          path: |
            release-artifacts/*.apk
            release-artifacts/*.sha256
          if-no-files-found: error

      - name: Clean Up Ephemeral Keystores
        if: always()
        run: rm -f "${RUNNER_TEMP}/release-upload-key.jks" debug.keystore

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-artifacts/*.apk
            release-artifacts/*.sha256
