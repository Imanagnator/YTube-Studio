name: Android Build & Signed Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Assemble Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTube-Studio-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  release-apk:
    name: Build Signed Production Release APK
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-debug
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Decode Release Keystore from Hidden GitHub Secret
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "ERROR: RELEASE_KEYSTORE_BASE64 secret is not configured in repository Settings -> Secrets."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/release-upload-key.jks"

      - name: Assemble Signed Production Release APK (R8 Minified)
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release-upload-key.jks
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Generate SHA-256 Checksum
        run: |
          cd app/build/outputs/apk/release
          mv app-release.apk "YTube-Studio-${GITHUB_REF_NAME}-arm64-release.apk"
          sha256sum "YTube-Studio-${GITHUB_REF_NAME}-arm64-release.apk" > "YTube-Studio-${GITHUB_REF_NAME}-arm64-release.apk.sha256"

      - name: Clean Up Ephemeral Keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/release-upload-key.jks"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/YTube-Studio-*-arm64-release.apk
            app/build/outputs/apk/release/YTube-Studio-*-arm64-release.apk.sha256
